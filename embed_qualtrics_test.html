<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Study</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#ffffff; }
  #surveyFrame { display:block; width:100%; height:100%; border:0; }
  #fallback { display:none; max-width:600px; margin:15vh auto; padding:0 24px;
              font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
              font-size:16px; line-height:1.6; color:#2b2b2b; text-align:center; }
  #fallback a { color:#1c4faf; }
</style>
</head>
<body>

<iframe id="surveyFrame" title="Study" allow="clipboard-write"></iframe>

<div id="fallback">
  <p>If the study does not load below, open it directly:</p>
  <p><a id="directLink" href="#" target="_blank">Continue to the study</a></p>
</div>

<script>
  var SURVEY_URL = "https://shenzhenshss.au1.qualtrics.com/jfe/form/SV_1RlMe9s5LagQgJw";

  var qs = window.location.search;
  var src = SURVEY_URL + (qs ? (SURVEY_URL.indexOf("?") > -1 ? "&" + qs.slice(1) : qs) : "");

  document.getElementById("surveyFrame").src = src;
  document.getElementById("directLink").href = src;

  setTimeout(function () {
    var f = document.getElementById("surveyFrame");
    var loaded = false;
    try { loaded = !!(f.contentWindow && f.contentWindow.location); } catch (e) { loaded = true; }
    if (!loaded) { document.getElementById("fallback").style.display = "block"; }
  }, 4000);
</script>

</body>
</html>
